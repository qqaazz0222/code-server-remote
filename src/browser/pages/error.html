<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="style-src 'self'; manifest-src 'self'; img-src 'self' data:; font-src 'self' data:;"
    />
    <meta name="color-scheme" content="light dark" />
    <title>{{ERROR_TITLE}} - {{APP_NAME}}</title>
    <link rel="icon" href="{{CS_STATIC_BASE}}/src/images/{{LOGO}}.svg" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="192x192" href="{{CS_STATIC_BASE}}/src/images/{{LOGO}}-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="{{CS_STATIC_BASE}}/src/images/{{LOGO}}-512.png" />
    <link href="{{CS_STATIC_BASE}}/src/browser/pages/global.css" rel="stylesheet" />
    <link href="{{CS_STATIC_BASE}}/src/browser/pages/theme.css" rel="stylesheet" />
    <link href="{{CS_STATIC_BASE}}/src/browser/pages/error.css" rel="stylesheet" />
    <meta id="coder-options" data-settings="{{OPTIONS}}" />
  </head>
  <body>
    <div class="center-container">
      <main class="error-display card">
        <div class="top">
          <div>
            <h2 class="header">{{ERROR_HEADER}}</h2>
            <div class="body">{{ERROR_BODY}}</div>
          </div>
          <img class="logo-tile" src="{{CS_STATIC_BASE}}/src/images/{{LOGO}}.svg" alt="" />
        </div>
        <div class="links">
          <a class="btn round" href="{{BASE}}{{TO}}" title="Go home" aria-label="Go home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </a>
        </div>
      </main>
    </div>
  </body>
</html>
